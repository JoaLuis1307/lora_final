services:
  # 1. Base de Datos Relacional (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: ecolora-db
    restart: always
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: iot_db
    # Solo accesible desde el propio VPS (no expuesto a Internet)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d iot_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. Broker de Mensajería MQTT (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: ecolora-mqtt
    restart: always
    logging: *default-logging
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 10s

  # 3. Base de Datos Temporal (InfluxDB v2)
  influxdb:
    image: influxdb:2.7-alpine
    container_name: ecolora-influxdb
    restart: always
    logging: *default-logging
    # Solo accesible desde el propio VPS; para la consola usa un túnel SSH:
    #   ssh -L 8086:127.0.0.1:8086 root@179.7.180.81
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin12345
      - DOCKER_INFLUXDB_INIT_ORG=iot_org
      - DOCKER_INFLUXDB_INIT_BUCKET=iot_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=jLsONHjrqqtbPKF4snQs-l4oGS-Eo7y7Biq8O6HtUxbqJMsOGTWANg5rp6gW7feI2saXoDeJzsD2dzq7nYl_kQ==
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 4. Servidor API Backend (Fastify)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecolora-backend
    restart: always
    logging: *default-logging
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - JWT_SECRET=supersecret_jwt_key_smart_containers_2026
      - MQTT_BROKER=mqtt://mqtt
      - MQTT_PORT=1883
      - DB_MODE=prisma
      - DATABASE_URL=postgresql://admin:admin123@db:5432/iot_db?schema=public
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=jLsONHjrqqtbPKF4snQs-l4oGS-Eo7y7Biq8O6HtUxbqJMsOGTWANg5rp6gW7feI2saXoDeJzsD2dzq7nYl_kQ==
      - INFLUX_ORG=iot_org
      - INFLUX_BUCKET=iot_bucket
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 5. Aplicación Web Frontend (React + Nginx)
  frontend:
    build:
      context: ./web_app
      dockerfile: Dockerfile
    container_name: ecolora-frontend
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
